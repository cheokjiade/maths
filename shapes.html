<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shapes Worksheet Generator</title>
<link rel="stylesheet" href="assets/worksheet.css">
<style>
  /* shapes-specific components */
  .qrow { display:flex; align-items:center; justify-content:space-between; gap:18px; flex-wrap:wrap; }
  .shp { vertical-align:middle; margin:2px; }
  .shape-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .pic-box { border:1.5px solid #888; border-radius:6px; padding:10px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; max-width:62%; }
  input.txt, input.num { font:inherit; text-align:center; border:none; border-bottom:2px solid var(--ink); background:transparent; color:var(--ink); }
  input.txt { width:150px; } input.num { width:56px; }
  .chip.shapechip { border-radius:10px; padding:6px; }
  .drawbox { border:1.5px solid #888; border-radius:6px; height:120px; width:200px; display:flex; align-items:flex-start; justify-content:flex-start; }
  .drawbox .cap { font-size:12pt; padding:4px 8px; color:#444; }
  .grids { display:flex; gap:24px; flex-wrap:wrap; align-items:flex-start; }
  .gridwrap { text-align:center; font-size:11pt; color:#555; }
  svg.grid { touch-action:none; }
  .gdot { fill:#444; } .gdot.sel { fill:var(--accent); }
  .gline { stroke:var(--accent); stroke-width:3; stroke-linecap:round; }
  .gline.correct { stroke:var(--right); } .gline.extra { stroke:var(--wrong); } .gline.missing { stroke:#999; stroke-dasharray:5 5; }
  .gtarget { stroke:#000; stroke-width:3; stroke-linecap:round; fill:none; }
  .ghit { fill:transparent; }
  @media print { .gline, .gline.correct, .gline.extra { stroke:#000; } .gline.missing { display:none; } }
</style>
</head>
<body>
<details class="panel no-print" id="ws-panel" open>
  <summary>🔷 Shapes Worksheet — options</summary>
  <div class="panel-body">
    <div class="backlink"><a href="index.html">&larr; All worksheets</a></div>
    <div class="fields">
      <label data-tip="A word or number that makes the worksheet. The same seed always makes the same sheet; leave blank for a random one.">Seed <input type="text" id="f-seed" placeholder="random"></label>
      <label data-tip="Write the name of a shown shape.">Name <input type="number" id="f-name" min="0" max="20"></label>
      <label data-tip="Tap every shape in a row that matches a named shape.">Colour-match <input type="number" id="f-match" min="0" max="20"></label>
      <label data-tip="Count how many of each kind of shape are in a picture.">Count <input type="number" id="f-count" min="0" max="10"></label>
      <label data-tip="Decide whether shapes are grouped by size, colour or shape.">Grouped-by <input type="number" id="f-group" min="0" max="10"></label>
      <label data-tip="Name the two shapes a combined figure is made of.">Name 2 parts <input type="number" id="f-compose" min="0" max="20"></label>
      <label data-tip="Choose the shape of an everyday object's face.">Object→shape <input type="number" id="f-object" min="0" max="20"></label>
      <label data-tip="Copy a figure by joining grid dots (tap two dots to draw a line). Auto-marked.">Copy-grid <input type="number" id="f-grid" min="0" max="10"></label>
      <label data-tip="Print-only: an empty box to draw a named shape by hand.">Draw (print) <input type="number" id="f-draw" min="0" max="12"></label>
      <label data-tip="Print-only: draw lines to split a figure into named parts.">Partition (print) <input type="number" id="f-part" min="0" max="10"></label>
    </div>
    <div class="btns">
      <button class="go" id="b-apply">Generate</button>
      <button id="b-random">🎲 Random seed</button>
      <button class="primary" id="b-submit">✅ Submit &amp; Mark</button>
      <button id="b-reset">Clear answers</button>
      <button id="b-print">🖨️ Print</button>
    </div>
    <div class="hint">Type the shape name (e.g. "circle", "half circle"), tap shapes/options to select, or join grid dots to copy a figure. Same seed + settings = same worksheet.</div>
  </div>
</details>

<div class="score" id="score"></div>

<h1>Shapes Practice</h1>
<div class="meta-line" id="meta"></div>
<div class="name-row"><div>Name: <span></span></div><div>Date: <span></span></div></div>
<div id="sheet"></div>
<div class="footer">Great job! 🔺🔵⬛</div>

<script src="assets/worksheet.js"></script>
<script>
"use strict";
const cfg={ seed:WS.Q.get('seed')||WS.randomSeed(),
  name:WS.clamp(WS.toInt(WS.Q.get('name'),4),0,20), match:WS.clamp(WS.toInt(WS.Q.get('match'),2),0,20),
  count:WS.clamp(WS.toInt(WS.Q.get('count'),1),0,10), group:WS.clamp(WS.toInt(WS.Q.get('group'),2),0,10),
  compose:WS.clamp(WS.toInt(WS.Q.get('compose'),3),0,20), object:WS.clamp(WS.toInt(WS.Q.get('object'),3),0,20),
  grid:WS.clamp(WS.toInt(WS.Q.get('grid'),2),0,10), draw:WS.clamp(WS.toInt(WS.Q.get('draw'),2),0,12),
  part:WS.clamp(WS.toInt(WS.Q.get('part'),2),0,10) };
const rng=WS.makeRng(cfg.seed);
const { randInt, pick, shuffle } = WS.helpers(rng);

/* ---------- shape SVG library ---------- */
const SHAPES=['rectangle','square','circle','triangle','half circle','quarter circle'];
function shapeBody(kind,fill){
  const f='fill="'+(fill||'#fff')+'" stroke="#000" stroke-width="3" stroke-linejoin="round"';
  switch(kind){
    case 'rectangle': return '<rect x="6" y="28" width="88" height="44" '+f+'/>';
    case 'square': return '<rect x="20" y="20" width="60" height="60" '+f+'/>';
    case 'circle': return '<circle cx="50" cy="50" r="40" '+f+'/>';
    case 'triangle': return '<polygon points="50,10 90,86 10,86" '+f+'/>';
    case 'half circle': return '<path d="M12,62 A38,38 0 0 1 88,62 Z" '+f+'/>';
    case 'quarter circle': return '<path d="M20,82 L82,82 A62,62 0 0 0 20,20 Z" '+f+'/>';
  }
  return '';
}
function shapeSVG(kind,opts){
  opts=opts||{}; const sz=opts.size||54; const rot=opts.rot||0; const fill=opts.fill||'#fff';
  return '<svg class="shp" width="'+sz+'" height="'+sz+'" viewBox="0 0 100 100"><g transform="rotate('+rot+' 50 50)">'+shapeBody(kind,fill)+'</g></svg>';
}
const COLOURS=['#f6c0c0','#bcd6f6','#bfe7c2','#f6e3a8','#d9c2ee'];

/* ---------- input/select factories ---------- */
let uid=0;
const nameIn=ans=>'<span class="field"><input class="txt gradable" data-kind="name" data-answer="'+ans+'" type="text" autocomplete="off"></span>';
const numIn=ans=>'<span class="field"><input class="num gradable" data-answer="'+ans+'" type="text" inputmode="numeric" autocomplete="off"></span>';
function selBlock(mode,options){
  const id='s'+(uid++);
  let chips=options.map(o=>'<button type="button" class="chip '+(o.shape?'shapechip':'')+'" data-ok="'+(o.ok?1:0)+'">'+o.html+'</button>').join('');
  return '<div class="sel-block" data-mode="'+mode+'" id="'+id+'"><div class="chips">'+chips+'</div></div>';
}

/* ---------- markable generators ---------- */
function gName(i){
  const k=pick(SHAPES); const n=randInt(3,5);
  let row='<div class="shape-row">'; for(let j=0;j<n;j++) row+=shapeSVG(k,{size:randInt(40,64),rot:pick([0,0,15,30,45,-20])}); row+='</div>';
  return '<div class="item"><div class="qrow"><div>'+row+'</div><div>This shape is a '+nameIn(k)+'.</div></div></div>';
}
function gMatch(i){
  const target=pick(SHAPES); const others=shuffle(SHAPES.filter(s=>s!==target));
  const opts=[];
  const nTarget=randInt(2,3);
  for(let j=0;j<nTarget;j++) opts.push({html:shapeSVG(target,{size:46,rot:pick([0,20,40])}),ok:true,shape:true});
  for(let j=0;j<5-nTarget;j++) opts.push({html:shapeSVG(others[j%others.length],{size:46,rot:pick([0,20,40])}),ok:false,shape:true});
  return '<div class="item"><span class="label">'+i+'.</span> Colour (tap) every <b>'+target+'</b>.'+selBlock('many',shuffle(opts))+'</div>';
}
function gCount(i){
  const kinds=SHAPES.slice(); const counts={}; let pool=[];
  kinds.forEach(k=>{ const c=randInt(0,4); counts[k]=c; for(let j=0;j<c;j++) pool.push(k); });
  if(pool.length<3){ const k=pick(kinds); counts[k]+=3; for(let j=0;j<3;j++) pool.push(k); }
  pool=shuffle(pool);
  let box='<div class="pic-box">'; pool.forEach(k=>box+=shapeSVG(k,{size:40,rot:pick([0,0,15,30])})); box+='</div>';
  let qs=''; kinds.forEach(k=>{ qs+='<div>There is/are '+numIn(counts[k])+' '+k+'(s).</div>'; });
  return '<div class="item"><span class="label">'+i+'.</span> This picture is made of many shapes. Count them.<div class="qrow" style="align-items:flex-start;"><div>'+qs+'</div>'+box+'</div></div>';
}
function gGroup(i){
  const mode=pick(['size','colour','shape']); const k=pick(SHAPES);
  function boxOf(variant){
    let s='<div class="pic-box" style="max-width:42%;">';
    for(let j=0;j<3;j++){
      if(mode==='size') s+=shapeSVG(k,{size: variant==='A'?34:58});
      else if(mode==='colour') s+=shapeSVG(k,{size:46,fill: variant==='A'?COLOURS[0]:COLOURS[1]});
      else s+=shapeSVG(variant==='A'?k:SHAPES.filter(x=>x!==k)[0],{size:46});
    }
    return s+'</div>';
  }
  const opts=['size','colour','shape'].map(m=>({html:m,ok:m===mode}));
  return '<div class="item"><span class="label">'+i+'.</span> How are these shapes grouped?<div class="qrow">'+boxOf('A')+boxOf('B')+'</div><div style="margin-top:8px;">They are grouped by '+selBlock('one',opts)+'</div></div>';
}
const COMPOSITES=[
  {parts:['half circle','triangle'], svg:'<svg width="150" height="90" viewBox="0 0 150 90"><path d="M10,70 A30,30 0 0 1 70,70 Z" fill="#ddd" stroke="#000" stroke-width="2"/><polygon points="70,40 140,55 70,70" fill="#ddd" stroke="#000" stroke-width="2"/></svg>'},
  {parts:['rectangle','triangle'], svg:'<svg width="120" height="110" viewBox="0 0 120 110"><polygon points="60,10 105,45 15,45" fill="#ddd" stroke="#000" stroke-width="2"/><rect x="20" y="45" width="80" height="55" fill="#ddd" stroke="#000" stroke-width="2"/></svg>'},
  {parts:['square','quarter circle'], svg:'<svg width="140" height="100" viewBox="0 0 140 100"><rect x="10" y="20" width="70" height="70" fill="#ddd" stroke="#000" stroke-width="2"/><path d="M80,90 L80,20 A70,70 0 0 1 150,90 Z" fill="#ddd" stroke="#000" stroke-width="2" transform="translate(0,0)"/></svg>'},
  {parts:['rectangle','half circle'], svg:'<svg width="120" height="120" viewBox="0 0 120 120"><rect x="25" y="20" width="70" height="50" fill="#ddd" stroke="#000" stroke-width="2"/><path d="M25,70 A35,35 0 0 0 95,70 Z" fill="#ddd" stroke="#000" stroke-width="2"/></svg>'},
];
function gCompose(i){
  const c=pick(COMPOSITES);
  return '<div class="item"><span class="label">'+i+'.</span> This figure is made of two shapes. Name them.<div class="qrow">'+c.svg+
    '<div data-compose="1">'+nameIn(c.parts[0])+' and '+nameIn(c.parts[1])+'</div></div></div>';
}
const OBJECTS=[
  {svg:'<svg width="80" height="80" viewBox="0 0 100 100"><rect x="15" y="15" width="70" height="70" fill="#cfe" stroke="#000" stroke-width="3"/><line x1="50" y1="15" x2="50" y2="85" stroke="#000" stroke-width="2"/><line x1="15" y1="50" x2="85" y2="50" stroke="#000" stroke-width="2"/></svg>', ans:'square', label:'window'},
  {svg:'<svg width="80" height="80" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#fed" stroke="#000" stroke-width="3"/><line x1="50" y1="50" x2="50" y2="22" stroke="#000" stroke-width="3"/><line x1="50" y1="50" x2="70" y2="55" stroke="#000" stroke-width="3"/></svg>', ans:'circle', label:'clock'},
  {svg:'<svg width="60" height="90" viewBox="0 0 70 100"><rect x="10" y="8" width="50" height="86" fill="#edc" stroke="#000" stroke-width="3"/><circle cx="50" cy="52" r="3" fill="#000"/></svg>', ans:'rectangle', label:'door'},
  {svg:'<svg width="80" height="80" viewBox="0 0 100 100"><polygon points="50,12 86,86 14,86" fill="#dfe" stroke="#000" stroke-width="3"/></svg>', ans:'triangle', label:'party hat'},
];
function gObject(i){
  const o=pick(OBJECTS);
  const opts=shuffle(['rectangle','square','circle','triangle']).map(s=>({html:s,ok:s===o.ans}));
  return '<div class="item"><span class="label">'+i+'.</span> What shape is the '+o.label+'? <span style="vertical-align:middle;">'+o.svg+'</span>'+selBlock('one',opts)+'</div>';
}

/* ---------- grid copy (interactive, marked) ---------- */
const FIGS=[
  [[1,1],[4,1],[4,4],[1,4],[1,1]],
  [[1,1],[3,3],[5,1],[5,4],[3,2],[1,4],[1,1]],
  [[1,4],[1,1],[4,1],[4,2],[2,2],[2,4],[1,4]],
  [[0,1],[2,4],[4,1]],
  [[1,1],[4,1],[4,3],[5,3],[3,5],[1,3],[2,3],[1,1]],
  [[1,2],[3,0],[5,2],[4,2],[4,4],[2,4],[2,2],[1,2]],
];
function pathToSegs(path){ const s=[]; for(let i=0;i<path.length-1;i++) s.push([path[i],path[i+1]]); return s; }
const gridState={};
function gGrid(i){
  const segs=pathToSegs(pick(FIGS)); const cols=6, rows=6, step=34, pad=14;
  const id='g'+(uid++);
  gridState[id]={segs:segs, user:[], sel:null, step:step, pad:pad, cols:cols, rows:rows};
  const W=pad*2+(cols-1)*step, H=pad*2+(rows-1)*step;
  function dots(interactive){ let d=''; for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){ const cx=pad+x*step, cy=pad+y*step;
    d+='<circle class="gdot" cx="'+cx+'" cy="'+cy+'" r="3"></circle>';
    if(interactive) d+='<circle class="ghit" data-gx="'+x+'" data-gy="'+y+'" cx="'+cx+'" cy="'+cy+'" r="13"></circle>'; } return d; }
  function tlines(){ return segs.map(s=>'<line class="gtarget" x1="'+(pad+s[0][0]*step)+'" y1="'+(pad+s[0][1]*step)+'" x2="'+(pad+s[1][0]*step)+'" y2="'+(pad+s[1][1]*step)+'"/>').join(''); }
  const left='<div class="gridwrap"><svg class="grid" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+dots(false)+tlines()+'</svg><div>copy this</div></div>';
  const right='<div class="gridwrap"><svg class="grid" id="'+id+'" data-grid="1" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'"><g class="userlines"></g>'+dots(true)+'</svg><div>your copy</div></div>';
  return '<div class="item"><span class="label">'+i+'.</span> Copy the figure onto the grid (tap two dots to join them; tap a line to remove it).<div class="grids">'+left+right+'</div></div>';
}

/* ---------- print-only ---------- */
function gDraw(i){ const k=pick(SHAPES); return '<div class="item" style="display:inline-block;margin-right:18px;"><div class="drawbox"><div class="cap">'+i+'. Draw a <b>'+k+'</b></div></div></div>'; }
function gPart(i){
  const c=pick(COMPOSITES);
  return '<div class="item"><span class="label">'+i+'.</span> Draw lines to show this figure is formed by a <b>'+c.parts[0]+'</b> and a <b>'+c.parts[1]+'</b>.<div class="qrow">'+c.svg.replace(/fill="#ddd"/g,'fill="#fff"')+'</div></div>'; }

/* ---------- assemble ---------- */
function section(title,count,fn){ if(count<=0) return ''; let b=''; for(let i=0;i<count;i++) b+=fn(i+1); return '<h2>'+title+'</h2>'+b; }
let html='';
html+=section('Name the shape.', cfg.name, gName);
html+=section('Colour the shapes that match the name.', cfg.match, gMatch);
html+=section('Count the shapes.', cfg.count, gCount);
html+=section('How are the shapes grouped?', cfg.group, gGroup);
html+=section('Name the two shapes in each figure.', cfg.compose, gCompose);
html+=section('What shape is each object?', cfg.object, gObject);
html+=section('Copy the figures to the grid.', cfg.grid, gGrid);
html+=section('Draw the shapes.', cfg.draw, gDraw);
html+=section('Form the figures (draw the dividing lines).', cfg.part, gPart);
document.getElementById('sheet').innerHTML=html;
document.getElementById('meta').textContent='seed: '+cfg.seed+'  •  shapes: rectangle, square, circle, triangle, half/quarter circle';

/* ---------- grid interaction ---------- */
function segKey(a,b){ const k1=a[0]+','+a[1], k2=b[0]+','+b[1]; return k1<k2 ? k1+'|'+k2 : k2+'|'+k1; }
function redrawGrid(id){
  const st=gridState[id]; const svg=document.getElementById(id); const g=svg.querySelector('.userlines');
  g.innerHTML=st.user.map(s=>{ const cls=s.cls?(' '+s.cls):''; return '<line class="gline'+cls+'" x1="'+(st.pad+s.a[0]*st.step)+'" y1="'+(st.pad+s.a[1]*st.step)+'" x2="'+(st.pad+s.b[0]*st.step)+'" y2="'+(st.pad+s.b[1]*st.step)+'"></line>'; }).join('');
  svg.querySelectorAll('.gdot').forEach(d=>d.classList.remove('sel'));
  if(st.sel){ svg.querySelectorAll('.gdot').forEach(d=>{ if(Math.abs(+d.getAttribute('cx')-(st.pad+st.sel[0]*st.step))<2 && Math.abs(+d.getAttribute('cy')-(st.pad+st.sel[1]*st.step))<2) d.classList.add('sel'); }); }
}
document.querySelectorAll('svg[data-grid]').forEach(svg=>{
  const id=svg.id; const st=gridState[id];
  svg.querySelectorAll('.ghit').forEach(h=>h.addEventListener('click',()=>{
    const x=+h.dataset.gx, y=+h.dataset.gy;
    if(!st.sel){ st.sel=[x,y]; }
    else if(st.sel[0]===x && st.sel[1]===y){ st.sel=null; }
    else {
      const key=segKey(st.sel,[x,y]);
      const idx=st.user.findIndex(s=>segKey(s.a,s.b)===key);
      if(idx>=0) st.user.splice(idx,1); else st.user.push({a:st.sel.slice(),b:[x,y]});
      st.sel=null;
    }
    redrawGrid(id);
  }));
});

/* ---------- shape-name marking + custom markers (shared engine) ---------- */
const SYN=s=>{ s=(s||'').toLowerCase().trim().replace(/\s+/g,' '); s=s.replace('semicircle','half circle').replace('semi circle','half circle').replace('oblong','rectangle'); if(s.length>1&&s.endsWith('s')) s=s.slice(0,-1); return s; };
WS.addKind('name', (v,a)=>SYN(v)===SYN(a));

// compose: order-independent pair of shape names (its inputs are skipped by the generic marker)
function composeExtra(){
  let total=0, right=0;
  document.querySelectorAll('[data-compose]').forEach(g=>{
    const inps=[...g.querySelectorAll('input.gradable')];
    const ans=inps.map(x=>SYN(x.dataset.answer)); const got=inps.map(x=>SYN(x.value));
    const pairOK = JSON.stringify([...ans].sort())===JSON.stringify([...got].sort());
    inps.forEach((inp,k)=>{ total++; const ok=pairOK||got[k]===ans[k]||ans.includes(got[k]); if(ok)right++; WS.setMark(inp,ok,inp.dataset.answer); });
  });
  return { total, right };
}
// grid copy: compare drawn segment set to the target set
function gridExtra(){
  let total=0, right=0;
  document.querySelectorAll('svg[data-grid]').forEach(svg=>{
    total++; const st=gridState[svg.id];
    const tset=new Set(st.segs.map(s=>segKey(s[0],s[1])));
    const uset=new Set(st.user.map(s=>segKey(s.a,s.b)));
    let allright = tset.size===uset.size; tset.forEach(k=>{ if(!uset.has(k)) allright=false; });
    st.user.forEach(s=>{ s.cls = tset.has(segKey(s.a,s.b))?'correct':'extra'; });
    st.segs.forEach(s=>{ const k=segKey(s[0],s[1]); if(!uset.has(k)) st.user.push({a:s[0],b:s[1],cls:'missing'}); });
    redrawGrid(svg.id);
    if(allright)right++;
  });
  return { total, right };
}
function gridClear(){ Object.keys(gridState).forEach(id=>{ gridState[id].user=[]; gridState[id].sel=null; if(document.getElementById(id)) redrawGrid(id); }); }

WS.wireChips();
WS.wirePanel(cfg, ['name','match','count','group','compose','object','grid','draw','part'], {
  mark:  () => WS.mark({ skip: inp => inp.closest('[data-compose]'), extras: [composeExtra, gridExtra] }),
  clear: () => WS.clearAll(gridClear),
});
</script>
</body>
</html>
